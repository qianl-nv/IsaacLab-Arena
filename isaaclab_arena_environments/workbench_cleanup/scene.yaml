object_references:
- id: tabletop
  parent_id: workbench
  prim_path: Tabletop
  object_type: rigid
  params: {}
- id: clutter_area
  parent_id: workbench
  prim_path: ClutterArea
  object_type: base
  params: {}
- id: top_rack
  parent_id: workbench
  prim_path: TopRack
  object_type: rigid
  params: {}
- id: left_drawers
  parent_id: workbench
  prim_path: Bench
  object_type: articulation
  params:
    openable_joint_name: joint_drawersA_01_joint_00
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
- id: top_left_drawer
  parent_id: workbench
  prim_path: Bench/Geometry/drawersA_01_obj_01
  object_type: base
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
relations:
- kind: is_anchor
  subject: tabletop
- kind: is_anchor
  subject: clutter_area
- kind: is_anchor
  subject: top_rack
- kind: is_anchor
  subject: outlet
- kind: is_anchor
  subject: power_plug
- kind: 'on'
  subject: socket_set
  reference: tabletop
  params:
    clearance_m: 0.012
- kind: 'on'
  subject: oscilloscope
  reference: tabletop
  params:
    clearance_m: 0.012
- kind: 'on'
  subject: overhead_bin
  reference: top_rack
  params:
    clearance_m: 0.012
    edge_margin_m: 0.01
- kind: clutter_on
  subject: slotted_screwdriver
  reference: clutter_area
  params:
    spread: 0.8
    gap_m: 0.008
    clearance_m: 0.015
    random_yaw: true
- kind: clutter_on
  subject: torx_screwdriver
  reference: clutter_area
  params:
    spread: 0.8
    gap_m: 0.008
    clearance_m: 0.015
    random_yaw: true
- kind: clutter_on
  subject: phillips_screwdriver
  reference: clutter_area
  params:
    spread: 0.8
    gap_m: 0.008
    clearance_m: 0.015
    random_yaw: true
- kind: clutter_on
  subject: combination_wrench
  reference: clutter_area
  params:
    spread: 0.8
    gap_m: 0.008
    clearance_m: 0.015
    random_yaw: true
- kind: clutter_on
  subject: small_wrench
  reference: clutter_area
  params:
    spread: 0.8
    gap_m: 0.008
    clearance_m: 0.015
    random_yaw: true
- kind: is_anchor
  subject: oscilloscope
- kind: is_anchor
  subject: overhead_bin
- kind: is_anchor
  subject: socket_set
placer_params:
  random_yaw_init: false
  min_unique_layouts_per_env: 1
  resolve_on_reset: false
  max_placement_attempts: 2
  solver_params:
    clearance_m: 0.002
    max_iters: 150
    save_position_history: false
  allow_best_loss_fallbacks: false
env_cfg_override:
  viewer:
    eye:
    - 2.15
    - -1.8
    - 1.8
    lookat:
    - 0
    - 0
    - 0.75
  sim:
    dt: 0.008333333333333333
  decimation: 2
