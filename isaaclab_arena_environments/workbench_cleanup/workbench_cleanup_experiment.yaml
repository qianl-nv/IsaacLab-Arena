# One passive episode through timeout. Use the force recipe for task success.
runs:
  workbench_cleanup_smoke:
    environment:
      type: isaaclab_arena_environments/workbench_cleanup/workbench_cleanup_smoke.yaml
    environment_builder:
      num_envs: 1
      presets: physx
    policy:
      type: zero_action
    rollout_limit:
      num_episodes: 1
