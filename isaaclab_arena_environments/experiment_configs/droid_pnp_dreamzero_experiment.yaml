runs:
  droid_pnp_dreamzero:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      hdr: home_office_robolab
    environment_builder:
      language_instruction: Pick up the Rubik's cube and place it in the bowl.
    policy:
      type: isaaclab_arena_dreamzero.policy.dreamzero_remote_policy.DreamZeroRemotePolicy
      remote_host: localhost
      remote_port: 5000
      policy_device: cuda:0
      dreamzero_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 3
