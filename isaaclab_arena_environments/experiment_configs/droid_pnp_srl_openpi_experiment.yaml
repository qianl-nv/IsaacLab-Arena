runs:
  droid_pnp_srl_openpi_billiard_hall:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      hdr: billiard_hall_robolab
    environment_builder:
      language_instruction: Pick up the Rubik's cube and place it in the bowl.
    # This YAML anchor keeps the shared OpenPI policy configuration in one place.
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 3

  droid_pnp_srl_openpi_rubiks_cube_home_office:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      hdr: home_office_robolab
    variations:
      destination_location.asset_selection.enabled: true
      destination_location.asset_selection.registry_names: [wooden_bowl_hot3d_robolab]
    environment_builder:
      language_instruction: Pick up the Rubik's cube and place it in the bowl.
    policy: *openpi_policy
    rollout_limit:
      num_episodes: 3

