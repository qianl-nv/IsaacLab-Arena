embodiment:
  id: operator
  registry_name: no_embodiment
background:
  id: packing_table
  registry_name: thor_packing_table
objects:
- id: thor_board
  registry_name: thor_packing_part
  params:
    asset_name: thor_board
- id: board_tray
  registry_name: thor_packing_part
  params:
    asset_name: board_tray
- id: ac_cable_us
  registry_name: thor_packing_part
  params:
    asset_name: ac_cable_us
- id: ac_cable_eu
  registry_name: thor_packing_part
  params:
    asset_name: ac_cable_eu
- id: usb_cable
  registry_name: thor_packing_part
  params:
    asset_name: usb_cable
- id: power_supply
  registry_name: thor_packing_part
  params:
    asset_name: power_supply
object_references:
- id: tabletop
  parent_id: packing_table
  prim_path: background/Table/Tabletop
  object_type: base
- id: carton
  parent_id: packing_table
  prim_path: background/Carton
  object_type: rigid
- id: ac_bay
  parent_id: packing_table
  prim_path: background/ACBay
  object_type: rigid
- id: usb_bay
  parent_id: packing_table
  prim_path: background/USBBay
  object_type: rigid
- id: power_bay
  parent_id: packing_table
  prim_path: background/PowerBay
  object_type: rigid
relations:
- {kind: is_anchor, subject: tabletop}
- {kind: 'on', subject: thor_board, reference: tabletop}
- {kind: 'on', subject: board_tray, reference: tabletop}
- {kind: 'on', subject: ac_cable_us, reference: tabletop}
- {kind: 'on', subject: ac_cable_eu, reference: tabletop}
- {kind: 'on', subject: usb_cable, reference: tabletop}
- {kind: 'on', subject: power_supply, reference: tabletop}
placer_params:
  random_yaw_init: false
  resolve_on_reset: true
  allow_best_loss_fallbacks: false
env_cfg_override:
  viewer:
    eye: [0.18, -0.36, 2.85]
    lookat: [0.0, 0.0, 0.82]
  sim:
    dt: 0.008333333333333333
  decimation: 2
